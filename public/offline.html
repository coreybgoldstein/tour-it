<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c4425" />
  <title>Offline — Tour It</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #07100a;
      color: #fff;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px calc(env(safe-area-inset-bottom) + 32px);
    }
    .badge {
      width: 76px; height: 76px;
      border-radius: 50%;
      background: rgba(77,168,98,0.08);
      border: 1px solid rgba(77,168,98,0.18);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 18px;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 22px; font-weight: 900;
      margin-bottom: 10px;
      line-height: 1.2;
    }
    p {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      line-height: 1.6;
      max-width: 280px;
      margin-bottom: 24px;
    }
    button {
      background: #2d7a42;
      border: none;
      border-radius: 12px;
      padding: 13px 30px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 2px 14px rgba(45,122,66,0.35);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#4da862" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>We can't reach the course right now. Check your connection and try again — your scouting intel is waiting.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>
    // Auto-recover the moment the connection comes back, so the user
    // doesn't have to tap "Try again" manually.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
